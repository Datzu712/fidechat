services:

  # Una sola instancia de Postgres con dos bases: `keycloak` y `fidechat` (la de
  # la app). La segunda la crea sql/init-databases.sh en el primer arranque.
  postgres:
    image: postgres:latest
    env_file:
      - .env
    container_name: fidechat-keycloak-postgres
    environment:
      POSTGRES_USER: ${PG_USER:?error}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?error}
      POSTGRES_DB: ${PG_NAME:-keycloak}
      APP_DB_NAME: ${APP_DB_NAME:-fidechat}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${PG_USER} -d ${PG_NAME:-keycloak}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - pg_keycloak_data_local:/var/lib/postgresql/data
      - ./sql/init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    container_name: fidechat-keycloak
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_DATABASE: 
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${PG_USER:?error}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-${PG_PASSWORD:?error}}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?error}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?error}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/${PG_NAME:-keycloak}}
    depends_on:
      - postgres
    ports:
      - "${KC_PORT:-8081}:8080"
    command: start-dev

volumes:
  pg_keycloak_data_local: