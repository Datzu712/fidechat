packages:
  - 'apps/*'
  - 'packages/*'

# Paquetes con scripts de instalación aprobados.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': true
  '@swc/core': true
  chromedriver: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
