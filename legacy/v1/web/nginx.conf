# Serves the frontend and proxies /api and /ws to the Java backend, so
# everything runs from a single origin (the session cookie is same-site).
server {
    listen 80;

    # Resolve `api` per request through Docker's DNS instead of at startup,
    # so nginx does not crash if the backend is not up yet.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
